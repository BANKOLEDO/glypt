services:
  - type: web
    name: glypt-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: pnpm install --frozen-lockfile
    startCommand: API_PORT=${PORT:-4000} pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Paste the Vercel Postgres (Neon) connection string here. Keep it private.
      - key: DATABASE_URL
        sync: false
      # Set after the Vercel site exists, e.g. https://glypt.vercel.app
      - key: WEB_ORIGIN
        sync: false
      # Bachs payments: secret key (sk_sandbox_... / sk_live_...) and the
      # endpoint's signing secret from the Bachs developer portal.
      - key: BACHS_API_KEY
        sync: false
      - key: BACHS_WEBHOOK_SECRET
        sync: false
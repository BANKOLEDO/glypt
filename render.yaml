databases:
  - name: glypt-db
    plan: free
    databaseName: glypt
    user: glypt

services:
  - type: web
    name: glypt-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: pnpm install --filter @glypt/api... && pnpm --filter @glypt/api build
    startCommand: API_PORT=${PORT:-4000} node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glypt-db
          property: connectionString
      # Set after the Vercel site exists, e.g. https://glypt.vercel.app
      - key: WEB_ORIGIN
        sync: false
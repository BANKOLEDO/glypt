[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glypt"
version = "0.1.0"
description = "Official Python SDK for the Glypt API - icons, brand kits, atlases and generated assets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Glypt Inc." }]
keywords = ["icons", "svg", "brand", "assets", "design"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://glypt.dev"
Documentation = "https://glypt.dev/docs"

[tool.setuptools.packages.find]
include = ["glypt*"]

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fff6ec; --ink: #221b15; --mute: #8a7e72; --line: #ecdfd0;
    --tang: #ff5a1f; --berry: #f23d97; --mint: #00c389; --citrine: #ffc531; --sky: #4cc9f0;
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; background: var(--paper); color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px;
    padding: 14px; user-select: none;
  }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .glyph {
    width: 26px; height: 26px; border-radius: 8px; background: var(--tang);
    border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
    display: grid; place-items: center; color: var(--paper);
    font-family: "Martian Mono", monospace; font-weight: 700; font-size: 13px;
  }
  .wordmark { font-family: "Martian Mono", monospace; font-weight: 700; letter-spacing: .1em; font-size: 15px; }
  .ver { margin-left: auto; color: var(--mute); font-size: 10px; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 8px; }

  .domain {
    display: flex; align-items: center; gap: 6px; background: #fff;
    border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px;
    margin-bottom: 10px; box-shadow: 2px 2px 0 rgba(34,27,21,.12); overflow: hidden;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); flex: none; }
  #host { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

  button.primary {
    width: 100%; padding: 11px; background: var(--tang); color: var(--paper);
    border: 2px solid var(--ink); border-radius: 12px; cursor: pointer;
    font-family: "Martian Mono", monospace; font-weight: 700; font-size: 12px;
    letter-spacing: .06em; box-shadow: 3px 3px 0 var(--ink); transition: transform .05s, box-shadow .05s;
  }
  button.primary:hover { filter: brightness(1.05); }
  button.primary:active { transform: translate(3px, 3px); box-shadow: none; }
  button.ghost {
    width: 100%; margin-top: 8px; padding: 9px; background: #fff; color: var(--ink);
    border: 2px solid var(--ink); border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 600; box-shadow: 2px 2px 0 var(--ink); transition: transform .05s, box-shadow .05s;
  }
  button.ghost:active { transform: translate(2px, 2px); box-shadow: none; }

  #swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 12px; }
  .swatch { cursor: pointer; text-align: center; }
  .swatch .tile {
    aspect-ratio: 1; border-radius: 10px; border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 rgba(34,27,21,.25); transition: transform .08s;
  }
  .swatch:hover .tile { transform: translate(-1px,-1px) rotate(-2deg); }
  .swatch code { display: block; margin-top: 3px; font-size: 8.5px; color: var(--mute); }

  .links { display: flex; gap: 6px; margin-top: 12px; }
  .links a {
    flex: 1; text-align: center; text-decoration: none; color: var(--ink);
    background: #fff; border: 2px solid var(--line); border-radius: 10px;
    padding: 7px 0; font-size: 10.5px; font-weight: 600; letter-spacing: .04em;
  }
  .links a:hover { border-color: var(--ink); background: var(--citrine); }

  #status { margin-top: 10px; min-height: 16px; color: var(--mute); font-size: 10.5px; text-align: center; }
  #status.err { color: var(--berry); font-weight: 600; }
  #status.ok { color: var(--mint); font-weight: 700; }

  details { margin-top: 12px; border-top: 1.5px dashed var(--line); padding-top: 8px; }
  summary { cursor: pointer; color: var(--mute); font-size: 10px; letter-spacing: .12em; }
  details label { display: block; margin: 8px 0 3px; font-size: 10px; color: var(--mute); }
  details input {
    width: 100%; padding: 6px 8px; background: #fff; border: 1.5px solid var(--ink);
    border-radius: 8px; font: inherit; font-size: 11px; outline: none;
  }
</style>
</head>
<body>
  <header>
    <div class="glyph">G</div>
    <div class="wordmark">GLYPT</div>
    <div class="ver">v0.1.0</div>
  </header>

  <div class="domain">
    <span class="dot"></span>
    <span id="host">no tab</span>
  </div>

  <button id="extract" class="primary">EXTRACT PALETTE</button>
  <button id="copyAll" class="ghost" style="display:none">COPY ALL COLORS</button>

  <div id="swatches"></div>

  <div class="links">
    <a href="#" data-path="/dashboard">DASHBOARD</a>
    <a href="#" data-path="/atlas">ATLAS</a>
    <a href="#" data-path="/market">MARKET</a>
  </div>

  <div id="status"></div>

  <details>
    <summary>SETTINGS</summary>
    <label>API base (glypt api)</label>
    <input id="apiBase" placeholder="http://localhost:4000" />
    <label>App base (web app)</label>
    <input id="appBase" placeholder="http://localhost:5173" />
  </details>

<script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #fff6ec; --ink: #221b15; --mute: #8a7e72; --line: #ecdfd0;
    --tang: #ff5a1f; --berry: #f23d97; --mint: #00c389; --citrine: #ffc531; --sky: #4cc9f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px;
    padding: 12px; user-select: none;
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .glyph {
    width: 22px; height: 22px; border-radius: 6px; background: var(--tang);
    border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
    display: grid; place-items: center; color: var(--paper); font-weight: 700; font-size: 12px;
    font-family: "Martian Mono", monospace;
  }
  .wordmark { font-family: "Martian Mono", monospace; font-weight: 700; letter-spacing: .08em; font-size: 14px; }
  .tag { margin-left: auto; color: var(--mute); font-size: 10px; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px 8px; }

  .searchrow { display: flex; gap: 6px; }
  input[type="text"] {
    flex: 1; padding: 8px 10px; background: #fff; color: var(--ink);
    border: 2px solid var(--ink); border-radius: 10px; outline: none;
    font: inherit; box-shadow: 2px 2px 0 var(--ink);
  }
  input::placeholder { color: var(--mute); }
  .btn {
    padding: 8px 12px; background: var(--citrine); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 10px; cursor: pointer;
    font-family: "Martian Mono", monospace; font-weight: 700; font-size: 11px;
    box-shadow: 2px 2px 0 var(--ink); transition: transform .05s;
  }
  .btn:hover { filter: brightness(1.04); }
  .btn:active { transform: translate(2px, 2px); box-shadow: none; }

  .meta { display: flex; align-items: center; justify-content: space-between; margin: 12px 2px 6px; }
  .label { font-size: 10px; letter-spacing: .14em; color: var(--mute); }
  .sizes { display: flex; gap: 4px; }
  .size {
    min-width: 30px; text-align: center; padding: 3px 6px; border: 2px solid var(--ink);
    border-radius: 8px; background: #fff; cursor: pointer; font-weight: 600; font-size: 10px;
  }
  .size.on { background: var(--ink); color: var(--paper); box-shadow: 2px 2px 0 rgba(34,27,21,.25); }
  .tint { width: 22px; height: 22px; padding: 0; border: 2px solid var(--ink); border-radius: 8px; background: #fff; cursor: pointer; }

  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 260px; overflow-y: auto; padding: 2px; }
  .cell {
    aspect-ratio: 1; border: 2px solid var(--line); border-radius: 10px; background: #fff;
    display: grid; place-items: center; cursor: pointer; position: relative;
  }
  .cell:hover { border-color: var(--ink); box-shadow: 2px 2px 0 var(--tang); transform: translate(-1px,-1px); }
  .cell img { width: 55%; height: 55%; }
  .cell.flash { border-color: var(--mint); box-shadow: 2px 2px 0 var(--mint); }

  .recents { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .chip {
    border: 1.5px solid var(--ink); background: #fff; border-radius: 999px;
    padding: 2px 8px; font-size: 10px; cursor: pointer;
  }
  .chip:hover { background: var(--citrine); }

  .status { margin-top: 10px; min-height: 16px; color: var(--mute); font-size: 10.5px; }
  .status.err { color: var(--berry); font-weight: 600; }
  .dots::after { content: ""; animation: d 1s steps(4) infinite; }
  @keyframes d { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>
  <div class="brand">
    <div class="glyph">G</div>
    <div class="wordmark">GLYPT</div>
    <div class="tag">200k+ icons</div>
  </div>

  <div class="searchrow">
    <input id="q" type="text" placeholder="Search icons — rocket, heart, cloud…" />
    <button id="go" class="btn">FIND</button>
  </div>

  <div class="meta">
    <span class="label">RESULTS</span>
    <div style="display:flex; gap:6px; align-items:center;">
      <input id="tint" class="tint" type="color" value="#221b15" title="Tint inserted icons" />
      <div class="sizes">
        <button class="size" data-s="16">16</button>
        <button class="size on" data-s="24">24</button>
        <button class="size" data-s="32">32</button>
        <button class="size" data-s="48">48</button>
      </div>
    </div>
  </div>

  <div id="grid" class="grid"></div>
  <div id="recents" class="recents"></div>
  <div id="status" class="status"></div>

<script>
  const API = "http://localhost:4000";
  let size = 24;
  let recent = [];

  const q = document.getElementById("q");
  const grid = document.getElementById("grid");
  const status = document.getElementById("status");

  function say(text, err) {
    status.textContent = text;
    status.className = "status" + (err ? " err" : "");
    if (err) status.classList.add("dots");
  }

  document.querySelectorAll(".size").forEach((b) =>
    b.addEventListener("click", () => {
      document.querySelectorAll(".size").forEach((x) => x.classList.remove("on"));
      b.classList.add("on");
      size = Number(b.dataset.s);
    })
  );

  function renderRecents() {
    const wrap = document.getElementById("recents");
    if (!recent.length) { wrap.innerHTML = ""; return; }
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "RECENT";
    wrap.appendChild(label);
    for (const id of recent) {
      const c = document.createElement("button");
      c.className = "chip";
      c.textContent = id.split(":")[1];
      c.title = id;
      c.onclick = () => insert(id);
      wrap.appendChild(c);
    }
  }

  async function search() {
    const query = q.value.trim();
    if (!query) return;
    say("searching", true);
    parent.postMessage({ pluginMessage: { type: "search", q: query } }, "*");
  }

  function iconUrl(id) {
    const [prefix, name] = id.split(":");
    return `${API}/api/icon?prefix=${encodeURIComponent(prefix)}&name=${encodeURIComponent(name)}`;
  }

  function insert(id) {
    say(`inserting ${id}…`);
    parent.postMessage(
      { pluginMessage: { type: "insert", id, size, tint: document.getElementById("tint").value } },
      "*",
    );
  }

  function cellFor(id) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const img = document.createElement("img");
    img.src = iconUrl(id);
    img.loading = "lazy";
    img.onerror = () => (img.style.opacity = ".15");
    cell.appendChild(img);
    cell.title = id;
    cell.onclick = () => {
      cell.classList.add("flash");
      setTimeout(() => cell.classList.remove("flash"), 350);
      insert(id);
      recent = [id, ...recent.filter((r) => r !== id)].slice(0, 8);
      renderRecents();
    };
    return cell;
  }

  document.getElementById("go").onclick = search;
  q.addEventListener("keydown", (e) => e.key === "Enter" && search());

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "results") {
      grid.innerHTML = "";
      status.classList.remove("err");
      status.textContent = msg.ids.length ? `${msg.ids.length} matches — click to insert` : "no matches";
      for (const id of msg.ids) grid.appendChild(cellFor(id));
    } else if (msg.type === "error") {
      say(msg.message, true);
    }
  };

  say("type a query to begin");
</script>
</body>
</html>
